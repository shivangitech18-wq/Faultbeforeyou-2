<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaultBeforeYou — Gemma 4-Powered Equipment Fault Management</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- Brand & Mission Tagline -->
      <a href="#dashboard" class="brand-section" id="nav-brand">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.5L19.5 20H4.5L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
        </div>
        <div class="brand-text">
          <h1>FaultBeforeYou</h1>
          <div class="brand-tagline">Report once. Warn everyone. Verify recovery.</div>
        </div>
      </a>

      <!-- Main Navigation Tabs -->
      <nav class="nav-tabs" id="main-nav">
        <button class="nav-tab-btn active" data-view="dashboard">
          <span>📊</span> Dashboard
        </button>
        <button class="nav-tab-btn" data-view="report">
          <span>⚠️</span> Report Fault
        </button>
        <button class="nav-tab-btn" data-view="incidents">
          <span>🔧</span> Incidents
        </button>
        <button class="nav-tab-btn" data-view="troubleshoot">
          <span>📖</span> Troubleshooting
        </button>
        <button class="nav-tab-btn" data-view="history">
          <span>📜</span> History
        </button>
      </nav>

      <!-- Right Header Actions (AI Status + Persona Switcher) -->
      <div class="header-actions">
        
        <!-- Gemma 4 AI Status Indicator -->
        <div class="ai-status-pill" id="ai-status-indicator" title="Gemma 4 model status">
          <span class="ai-status-dot" id="ai-dot"></span>
          <span id="ai-status-text">Gemma 4: Checking...</span>
        </div>

        <!-- Interactive Demo Persona Switcher -->
        <div class="demo-switcher">
          <label for="persona-select">Persona:</label>
          <select id="persona-select">
            <option value="reporter">📢 Riley (Reporter)</option>
            <option value="tech">🔧 Taylor (Technician)</option>
            <option value="admin">🛡️ Alex (Admin / Verifier)</option>
            <option value="viewer">👁️ Victoria (Viewer)</option>
          </select>
        </div>

      </div>

    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-root">
    <!-- Dynamic views injected here by app.js -->
    <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
      <p>Loading FaultBeforeYou application...</p>
    </div>
  </main>

  <!-- Modal Overlay Container -->
  <div id="modal-container" class="modal-overlay" style="display: none;"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
